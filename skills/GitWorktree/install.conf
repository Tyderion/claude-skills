# Read by ../../setup; not copied into the installed skill.
#   require  <command> <min version|-> [arch=<package>] [brew=<package>]
#   optional <command> <min version|-> [arch=<package>] [brew=<package>] -- <what it enables>
#   bin      <name> <script, relative to the skill>     (a bun shim in ~/.local/bin)
# A manager left out means it has no package; setup then asks Claude to install it.
require  bun 1.1  arch=bun        brew=bun
require  git 2.48 arch=git        brew=git    # worktree.useRelativePaths
optional gh  -    arch=github-cli brew=gh     -- reusing worktrees whose GitHub PR was merged (afterwards: gh auth login)
bin      git-wt Tools/GitWt.ts
