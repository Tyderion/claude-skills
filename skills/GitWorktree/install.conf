# Read by ../../setup; not copied into the installed skill.
#   require  <command> <min version|-> [arch=<package>] [apt=<package>] [brew=<package>] [script=<https url>] [prefix-env=<var>] [needs=<command,...>]
#   optional <command> <min version|-> [same fields] -- <what it enables>
#   bin      <name> <script, relative to the skill>     (a bun shim in ~/.local/bin)
# A manager left out means it has no package; setup then runs script= if there is one, or asks Claude to install it.
# prefix-env names the variable that tells the script where to install; needs lists what it runs besides curl.
require  bun 1.1  arch=bun        brew=bun                script=https://bun.com/install prefix-env=BUN_INSTALL needs=unzip
require  git 2.48 arch=git        apt=git    brew=git     # worktree.useRelativePaths. Debian 13 and Ubuntu 24.04 package older, so there setup ends at its Claude prompt
optional gh  -    arch=github-cli apt=gh     brew=gh      -- reusing worktrees whose GitHub PR was merged (afterwards: gh auth login)
bin      git-wt Tools/GitWt.ts
optional direnv - arch=direnv     apt=direnv brew=direnv  -- wtc / git-wt open allowing a shared .envrc in new worktrees
